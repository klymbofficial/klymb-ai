# Learner reminders at 09:00, 14:00 and 20:00 on each learner's own clock, so this runs every hour
# (10 past each UTC hour: 40 past in India). Vercel's free plan allows one cron a day, so GitHub runs these.
# The endpoint decides who gets what; CRON_SECRET is a repository secret.
name: Learner reminders
on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch: {}
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send reminders
        run: |
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.klymb.ai/api/cron/reminders
      - name: Tell waiting System Design learners a lesson is out
        run: |
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.klymb.ai/api/cron/sd-releases
