# Learner reminders at 09:00, 14:00 and 20:00 IST (03:30, 08:30 and 14:30 UTC). Vercel's free plan allows one cron a day, so GitHub runs these.
# The endpoint decides who gets what; CRON_SECRET is a repository secret.
name: Learner reminders
on:
  schedule:
    - cron: "30 3,8,14 * * *"
  workflow_dispatch: {}
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send reminders
        run: |
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.klymb.ai/api/cron/reminders
