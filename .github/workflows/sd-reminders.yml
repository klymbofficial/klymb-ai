# Backup for the System Design reminder emails. The main trigger is the Vercel cron in vercel.json
# (14:30 UTC, which Vercel's free plan fires within that hour, so 19:30 to 20:30 IST).
# GitHub has started this schedule 6 to 8 hours late, after midnight IST, when the endpoint skips;
# it only helps on days it runs on time. The endpoint never mails anyone twice in a day, so running
# after Vercel, or a manual re-run, is safe. CRON_SECRET is a repository secret.
name: System Design reminders
on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch: {}
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Send reminders
        run: |
          curl -fsS --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.klymb.ai/api/cron/sd-reminders
