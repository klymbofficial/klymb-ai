# The System Design reminder emails, every hour: each learner is mailed once in their own evening
# (18:00 to midnight on their clock), so learners outside India need a run in their evening. The
# Vercel cron in vercel.json (14:30 UTC, about 20:00 IST) stays as a backup for learners on India time.
# GitHub can start a schedule hours late; with a six-hour window and a run every hour, a reminder
# still lands. The endpoint never mails anyone twice in a day, so overlapping runs or a manual
# re-run are safe. CRON_SECRET is a repository secret.
name: System Design reminders
on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch: {}
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Send reminders
        run: |
          curl -fsS --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.klymb.ai/api/cron/sd-reminders
